# Builds the game and publishes it to GitHub Pages (free hosting).
# Set the repository variable SPIN_API_URL (Settings → Secrets and variables → Actions → Variables)
# to your Worker URL, e.g. https://spin-duel-api.<your-subdomain>.workers.dev
name: Deploy game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: ./build.sh
      - name: Assemble site
        env:
          SPIN_API_URL: ${{ vars.SPIN_API_URL || 'https://spin-duel-api.spinduel.workers.dev' }}
        run: |
          mkdir -p site/assets
          cp -r assets/voice site/assets/
          cp assets/parts.json assets/parts_*.txt assets/reel.mp4 assets/reel.jpg site/assets/
          node -e "
            const fs=require('fs');
            const api=process.env.SPIN_API_URL||'';
            const body=fs.readFileSync('dist/index.html','utf8');
            const cfg=api?'<script>window.SPIN_CONFIG={api:'+JSON.stringify(api)+'}</script>':'';
            fs.writeFileSync('site/index.html','<!doctype html><html lang=\"zh-Hant\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>[hidden]{display:none!important}body{margin:0}</style>'+cfg+'</head><body>'+body+'</body></html>');
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
