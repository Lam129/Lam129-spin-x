name = "spin-duel-api"
main = "src/index.js"
compatibility_date = "2025-01-15"

[vars]
# Comma-separated list of sites allowed to call the API, e.g. "https://lam129.github.io"
ALLOWED_ORIGINS = "https://lam129.github.io"
RATE_PER_MIN = "90"
DAILY_WRITE_LIMIT = "80000"

[[d1_databases]]
binding = "DB"
database_name = "spin-duel"
database_id = "7b7b459a-c4d9-44f3-8f3c-e3bbb12b0273"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
